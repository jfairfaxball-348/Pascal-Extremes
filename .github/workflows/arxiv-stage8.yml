name: Stage 8 arXiv preflight

on:
  push:
    branches: [main]
    paths:
      - 'arxiv/stage-08/**'
      - 'paper/main.tex'
      - 'paper/references.bib'
      - '.github/workflows/arxiv-stage8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arxiv-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and test exact arXiv bundle
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            set -euo pipefail
            cmp paper/main.tex arxiv/stage-08/main.tex
            cmp paper/references.bib arxiv/stage-08/references.bib

            rm -rf /tmp/arxiv-bib /tmp/arxiv-bbl
            mkdir -p /tmp/arxiv-bib /tmp/arxiv-bbl "$GITHUB_WORKSPACE/.stage8-artifacts"

            cp arxiv/stage-08/main.tex arxiv/stage-08/references.bib /tmp/arxiv-bib/
            cd /tmp/arxiv-bib
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            bibtex main
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            test -f main.pdf
            test -f main.bbl
            ! grep -E 'There were undefined (references|citations)|Citation .* undefined|Reference .* undefined' main.log
            ! grep -E 'Overfull|Underfull' main.log
            pdfinfo main.pdf | grep '^Pages:'
            cp main.bbl "$GITHUB_WORKSPACE/.stage8-artifacts/main.bbl"
            cp main.pdf "$GITHUB_WORKSPACE/.stage8-artifacts/main-bib.pdf"

            cp "$GITHUB_WORKSPACE/arxiv/stage-08/main.tex" "$GITHUB_WORKSPACE/arxiv/stage-08/references.bib" .
            cp main.bbl /tmp/arxiv-bbl/
            cp "$GITHUB_WORKSPACE/arxiv/stage-08/main.tex" "$GITHUB_WORKSPACE/arxiv/stage-08/references.bib" /tmp/arxiv-bbl/
            cd /tmp/arxiv-bbl
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            test -f main.pdf
            ! grep -E 'There were undefined (references|citations)|Citation .* undefined|Reference .* undefined' main.log
            ! grep -E 'Overfull|Underfull' main.log
            pdfinfo main.pdf | grep '^Pages:'
            cp main.pdf "$GITHUB_WORKSPACE/.stage8-artifacts/main-bbl.pdf"

            cmp /tmp/arxiv-bib/main.pdf /tmp/arxiv-bbl/main.pdf
            cd /tmp/arxiv-bbl
            tar -czf "$GITHUB_WORKSPACE/.stage8-artifacts/arxiv-stage-08.tar.gz" main.tex references.bib main.bbl
            printf 'Bundle contents:\nmain.tex\nreferences.bib\nmain.bbl\n' > "$GITHUB_WORKSPACE/.stage8-artifacts/manifest.txt"
            sha256sum main.tex references.bib main.bbl main.pdf > "$GITHUB_WORKSPACE/.stage8-artifacts/sha256.txt"

      - name: Upload preflight artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-stage-08-preflight
          path: .stage8-artifacts/
          if-no-files-found: error
